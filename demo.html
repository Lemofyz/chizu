<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbfefb">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Chizu · free demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* Desk companion demo: Chizu sits in the middle of a white screen; timer at the bottom. */
  :root{--bg:#fbfefb;--ink:#26222e;--deep:#3e3352;--lav:#8c74d4;--soft:#6c6676;--line:#ece9f1;--glass:rgba(255,255,255,.85)}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
  .stage{position:fixed;inset:0;display:grid;place-items:center}
  .frame{position:relative;width:min(92vw,68vh);aspect-ratio:1;touch-action:manipulation;cursor:pointer}
  .frame img,.frame video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .frame video{opacity:0;transition:opacity .2s}
  .frame video.on{opacity:1}
  /* Until her real clips arrive, the photo breathes and reacts with simple squishes. */
  #pic{position:absolute;inset:0;transform-origin:50% 88%;animation:breathe 3.6s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.008,1.02)}}
  #pic.still{animation:none}
  #pic.pat{animation:pat .7s ease-out}
  @keyframes pat{30%{transform:scale(1.05,.93)}60%{transform:scale(.98,1.03)}}
  #pic.poke{animation:poke .5s ease-in-out}
  @keyframes poke{20%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}80%{transform:rotate(-1.5deg)}}
  #pic.tail{animation:tail .9s ease-in-out}
  @keyframes tail{25%{transform:skewX(-2deg)}75%{transform:skewX(2deg)}}
  #pic.hug{animation:hug 1.1s ease-out}
  @keyframes hug{30%{transform:scale(1.08,.9)}70%{transform:scale(1.03,.97)}}
  #pic.hop{animation:hop .8s ease-out}
  @keyframes hop{30%{transform:translateY(-7%) scale(.97,1.04)}55%{transform:translateY(0) scale(1.04,.95)}}
  #pic.away{animation:none;transform:scaleX(-1);transition:transform .4s}
  #pic.sleepy{animation:sleepy 2.4s ease-in-out}
  @keyframes sleepy{40%{transform:translateY(2%) scale(1.02,.96)}}
  .bubble{position:absolute;left:50%;top:-2%;transform:translateX(-50%);background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:.55rem 1rem;font-size:clamp(.85rem,2.2vh,1.02rem);box-shadow:0 10px 30px rgba(62,51,82,.1);white-space:nowrap;max-width:92vw;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:2}
  .bubble.show{opacity:1;transform:translateX(-50%) translateY(4px)}
  .fx{position:absolute;pointer-events:none;font-size:22px;animation:rise 1s ease-out forwards;z-index:2}
  @keyframes rise{to{transform:translateY(-70px) scale(1.3);opacity:0}}
  .bar{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;gap:.4rem;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);border-radius:999px;padding:.4rem .45rem .4rem 1rem;box-shadow:0 8px 28px rgba(62,51,82,.08);max-width:calc(100vw - 24px)}
  .time{font-family:Fraunces,serif;font-weight:600;font-size:1.6rem;color:var(--deep);min-width:4.6ch;text-align:center;font-variant-numeric:tabular-nums}
  .bar button{white-space:nowrap;border:0;cursor:pointer;font:700 .85rem Nunito,sans-serif;border-radius:999px;padding:.55rem .85rem;background:transparent;color:var(--soft)}
  .bar button.sel{background:#f1edfa;color:var(--deep)}
  .bar button.lock{opacity:.45}
  .bar button.go{background:var(--deep);color:#fff;padding:.6rem 1.15rem}
  .top{position:fixed;z-index:3;top:max(12px,env(safe-area-inset-top));left:0;right:0;display:flex;justify-content:center;gap:.5rem;flex-wrap:wrap;padding:0 12px}
  .pill{font-size:.8rem;color:var(--soft);background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:.3rem .8rem;text-decoration:none}
  a.pill{color:var(--deep);font-weight:700}
  button.pill{font:700 .8rem Nunito,sans-serif;color:var(--deep);cursor:pointer}
  button.pill.on{background:#f1edfa;border-color:#d9cff5}
  .hint{position:fixed;left:0;right:0;bottom:calc(max(14px,env(safe-area-inset-bottom)) + 78px);text-align:center;font-size:.8rem;color:var(--soft);transition:opacity .6s}
  @media (prefers-reduced-motion:reduce){#pic{animation:none!important}.fx{display:none}}
</style>
</head>
<body>
<div class="top">
  <span class="pill" id="stats">Today 0 min with Chizu · 0 pats</span>
  <button class="pill" id="outfit" type="button">👚 Pajamas</button>
  <a class="pill" href="index.html#reserve">Free demo · Reserve the full Chizu</a>
</div>
<div class="stage">
  <div class="frame" id="frame" aria-label="Chizu. Tap her head, tummy or tail. Hold to hug.">
    <div id="pic"><img src="assets/chizu.jpg" alt="Chizu" draggable="false"><video id="vid" muted playsinline preload="auto"></video></div>
    <div class="bubble" id="bubble"></div>
  </div>
</div>
<div class="hint" id="hint">Pat her head · poke her tummy · touch her tail · hold to hug</div>
<div class="bar">
  <span class="time" id="time">25:00</span>
  <button data-min="25" class="sel">25</button>
  <button data-min="50" class="lock" title="Full version">50 🔒</button>
  <button class="go" id="go">Focus</button>
</div>
<script>
  // Real clips go in assets/clips/<name>.mp4 (idle, pat, poke, tail, hug, hop, sleepy...).
  // Any clip that exists replaces the photo animation for that reaction.
  const LINES = {
    pat:["Mm. Acceptable.","…you may continue.","Softest cat on your desk. Obviously."],
    poke:["Excuse me.","That is a tummy, not a button.","I will remember this."],
    tail:["The tail is not for touching.","Fine. One swish. For you."],
    hug:["…okay. Five more seconds.","You're warm. That's all it is."],
    hop:["Mrrp?","Oh. You're still here. Good."],
    focus:["I'll sit right here. Don't touch your phone.","Work. I'm watching."],
    cheer:["Done? Look at you.","Not bad. Treats later?"],
    away:["You picked up your phone. I saw.","Hmph. I'm not looking at you."],
    back:["…fine. Welcome back.","Took you long enough."],
    sleepy:["*yawn* It's late. Bed?","My eyes are closing. Yours too."],
    locked:["50 minutes is in the full version. Reserve me?"]
  };
  // In pajamas she has her own moves and her own lines.
  const PJ = {idle:'pj_idle', pat:'pj_rub', tail:'pj_yawn', hop:'pj_yawn', sleepy:'pj_sleep', hug:'pj_sleep'};
  const LINES_PJ = {
    pat:["Mm… head pats are allowed at bedtime.","*rubs eyes* …again?"],
    tail:["*big stretch* …that was not a yawn.","Five more minutes."],
    hop:["*yawn* I'm awake. I'm awake."],
    hug:["Warm… don't move…","zzz… huh? I wasn't sleeping."],
    sleepy:["zzz…","My cap fell off. Don't look."],
    wear:["Pajamas on. Don't laugh.","Is it bedtime? It's bedtime."],
    unwear:["Okay. Awake mode.","Back to work, I suppose."]
  };
  let outfit = localStorage.getItem('chizu_outfit') === 'pj' ? 'pj' : 'plain';
  const pic = document.getElementById('pic'), vid = document.getElementById('vid');
  const clip = {};
  async function hasClip(name){
    if (name in clip) return clip[name];
    try { const r = await fetch('assets/clips/' + name + '.mp4', {method:'HEAD'}); clip[name] = r.ok ? 'assets/clips/' + name + '.mp4' : null; }
    catch(_) { clip[name] = null; }
    return clip[name];
  }
  let busy = false, mode = 'idle', rest = '';  // rest becomes 'still' once her video breathes for her
  async function act(name){
    const key = outfit === 'pj' ? PJ[name] : name;
    const src = key ? await hasClip(key) : null;
    if (src) {
      if (name === 'idle') { rest = 'still'; pic.className = rest; }
      vid.loop = name === 'idle'; vid.src = src; vid.currentTime = 0;
      try { await vid.play(); vid.classList.add('on'); } catch(_){}
      if (name !== 'idle') { busy = true; vid.onended = () => { busy = false; act('idle'); }; }
      return;
    }
    if (name === 'idle') return;
    pic.className = rest; void pic.offsetWidth; pic.className = name;
    busy = true;
    if (name !== 'away') setTimeout(() => { busy = false; pic.className = rest; }, 1000);
  }
  const bubble = document.getElementById('bubble'); let bt;
  function say(key){ const a = (outfit === 'pj' && LINES_PJ[key]) || LINES[key]; if (!a) return; bubble.textContent = a[Math.floor(Math.random()*a.length)]; bubble.classList.add('show'); clearTimeout(bt); bt = setTimeout(()=>bubble.classList.remove('show'), 3200); }
  function fx(x, y, ch){ const s = document.createElement('span'); s.className='fx'; s.textContent = ch; s.style.left = x+'px'; s.style.top = y+'px'; frame.appendChild(s); setTimeout(()=>s.remove(), 1000); }

  // Stats stay on this device.
  const today = new Date().toISOString().slice(0,10);
  let st = {day: today, min: 0, pats: 0};
  try { const s = JSON.parse(localStorage.getItem('chizu') || '{}'); if (s.day === today) st = s; } catch(_){}
  function save(){ try { localStorage.setItem('chizu', JSON.stringify(st)); } catch(_){} document.getElementById('stats').textContent = 'Today ' + st.min + ' min with Chizu · ' + st.pats + ' pats'; }
  save();

  // Touch zones, as fractions of the square photo: head on top, tail on the right.
  function zone(x, y){ if (x > 0.64 && y > 0.38) return 'tail'; if (y < 0.45) return 'pat'; return 'poke'; }
  const frame = document.getElementById('frame'); let holdT, lastTap = 0;
  frame.addEventListener('pointerdown', e => { holdT = setTimeout(() => { holdT = null; react('hug', e); }, 650); });
  frame.addEventListener('pointerup', e => {
    if (!holdT) return; clearTimeout(holdT); holdT = null;
    const now = Date.now(); if (now - lastTap < 300) { lastTap = 0; return react('hop', e); } lastTap = now;
    const r = frame.getBoundingClientRect();
    react(zone((e.clientX - r.left)/r.width, (e.clientY - r.top)/r.height), e);
  });
  frame.addEventListener('pointerleave', () => { if (holdT) { clearTimeout(holdT); holdT = null; } });
  function react(kind, e){
    document.getElementById('hint').style.opacity = 0;
    const r = frame.getBoundingClientRect();
    fx(e.clientX - r.left, e.clientY - r.top, kind === 'poke' ? '💢' : kind === 'hug' ? '💜' : kind === 'tail' ? '〰️' : '✨');
    if (kind === 'pat' || kind === 'hug') { st.pats++; save(); }
    say(kind);
    if (!busy || kind === 'hug') act(kind);
  }

  // Focus timer: 25 minutes in the demo.
  let total = 25*60, left = total, timer = null, leftAt = 0;
  const timeEl = document.getElementById('time'), go = document.getElementById('go');
  const fmt = s => String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
  document.querySelector('[data-min="50"]').onclick = () => say('locked');
  go.onclick = () => {
    if (timer) { clearInterval(timer); timer = null; mode = 'idle'; go.textContent = 'Focus'; return; }
    mode = 'focus'; go.textContent = 'Pause'; say('focus');
    timer = setInterval(() => {
      left--; timeEl.textContent = fmt(left);
      if (left % 60 === 0) { st.min++; save(); }
      if (left <= 0) { clearInterval(timer); timer = null; mode = 'idle'; go.textContent = 'Focus'; left = total; timeEl.textContent = fmt(left); say('cheer'); act('hop'); }
    }, 1000);
  };
  // Leave during focus and she turns her back; come back and she slowly forgives you.
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { leftAt = Date.now(); return; }
    if (mode === 'focus' && Date.now() - leftAt > 8000) {
      say('away'); busy = true; pic.className = 'away';
      setTimeout(() => { pic.className = rest; busy = false; say('back'); }, 3500);
    }
  });
  setInterval(() => { const h = new Date().getHours(); if (!busy && (h >= 23 || h < 5) && Math.random() < 0.3) { say('sleepy'); act('sleepy'); } }, 90000);

  // Outfit switch: swaps her photo and her whole set of moves.
  const outfitBtn = document.getElementById('outfit'), img = pic.querySelector('img');
  function wear(o, quiet){
    outfit = o; try { localStorage.setItem('chizu_outfit', o); } catch(_){}
    img.src = o === 'pj' ? 'assets/chizu_pj.jpg' : 'assets/chizu.jpg';
    outfitBtn.classList.toggle('on', o === 'pj'); outfitBtn.textContent = o === 'pj' ? '👚 Pajamas on' : '👚 Pajamas';
    vid.classList.remove('on'); vid.onended = null; busy = false; rest = ''; pic.className = '';
    if (!quiet) say(o === 'pj' ? 'wear' : 'unwear');
    act('idle');
  }
  outfitBtn.onclick = () => wear(outfit === 'pj' ? 'plain' : 'pj');
  wear(outfit, true);
</script>
</body>
</html>
